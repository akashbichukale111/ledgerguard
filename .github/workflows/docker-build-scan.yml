name: Docker Build and Scan

on:
  push:
    branches: [ master, main, 'claude/**' ]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'frontend/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - '.github/workflows/docker-build-scan.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'frontend/**'
      - 'Dockerfile*'

permissions:
  contents: read
  # Required by github/codeql-action/upload-sarif. The default GITHUB_TOKEN does not carry it,
  # which is why the image builds and the Trivy scan both succeeded while the job still failed
  # with "Resource not accessible by integration".
  security-events: write

jobs:
  build-backend-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - transaction-service
          - reconciliation-service
          - query-service
          - auth-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (backend-${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ledgerguard/${{ matrix.service }}:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledgerguard/${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  build-frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (frontend)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ledgerguard/frontend:latest

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledgerguard/frontend:latest
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
