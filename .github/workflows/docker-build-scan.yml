name: Docker Build and Scan

on:
  push:
    branches: [ master, main, 'claude/**' ]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'frontend/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - '.github/workflows/docker-build-scan.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'frontend/**'
      - 'Dockerfile*'

jobs:
  build-backend-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - transaction-service
          - reconciliation-service
          - query-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build service JAR
        run: mvn clean package -pl services/${{ matrix.service }} -DskipTests --batch-mode --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (backend-${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ledgerguard/${{ matrix.service }}:latest
          build-args: |
            SERVICE_JAR=services/${{ matrix.service }}/target/${{ matrix.service }}-0.1.0-SNAPSHOT.jar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledgerguard/${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  build-frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (frontend)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ledgerguard/frontend:latest

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledgerguard/frontend:latest
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
