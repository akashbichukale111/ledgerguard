name: Performance Tests (Optional)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'services/**'
      - 'perf/**'
      - '.github/workflows/performance-tests.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  k6-load-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerguard
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_BROKER_ID: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for Kafka to be ready
        run: |
          for i in {1..30}; do
            nc -z localhost 9092 && echo "Kafka ready" && exit 0
            echo "Waiting for Kafka... ($i/30)"
            sleep 2
          done
          exit 1

      - name: Build services
        run: mvn clean package -DskipTests --batch-mode --no-transfer-progress

      - name: Start services in background
        run: |
          # Start transaction service
          java -jar services/transaction-service/target/transaction-service-0.1.0-SNAPSHOT.jar &
          sleep 10
          echo "Transaction service started"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run transaction ingestion load test
        run: |
          cd perf
          k6 run --quiet --summary-export=results.json \
            -e BASE_URL=http://localhost:8080/api/v1 \
            k6/scripts/transaction-ingestion.js
        continue-on-error: true

      - name: Check k6 results
        run: |
          # Parse results and check thresholds
          cat perf/results.json | grep -q '"error_rate"' && echo "✓ Performance test completed"
        continue-on-error: true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: perf/results.json
          retention-days: 30
