# ---------------------------------------------------------------------------
# LedgerGuard — local stack.
#
# Profiles (see docs/local-development.md):
#   infra  datastores + Kafka + Zipkin. Run services from an IDE against this.
#   core   infra + auth, transaction, reconciliation, gateway.
#   full   everything, including the operations console.
#
#   migrate  one-shot Flyway runners. Not a long-running profile.
#
# Image names are canonical Docker Hub references on purpose. If your network
# cannot reach Docker Hub, configure a registry mirror at the DAEMON level
# rather than editing this file — see docs/local-development.md.
#
# Memory limits are explicit so the stack's cost is a stated fact rather than
# whatever the host happens to allow. Measured actuals are in
# docs/phase-reports/phase-02.md.
# ---------------------------------------------------------------------------

name: ${COMPOSE_PROJECT_NAME:-ledgerguard}

x-restart: &restart
  restart: unless-stopped

services:

  # =========================================================================
  # infra
  # =========================================================================

  postgres:
    <<: *restart
    image: postgres:16-alpine
    # "migrate" included so the one-shot Flyway runners can resolve depends_on.
    profiles: ["infra", "core", "full", "migrate"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-ledgerguard}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: postgres
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -d postgres pins the database: pg_isready defaults to the username as
      # the database name, which succeeds too early during initdb.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-ledgerguard} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 768m

  mongo:
    <<: *restart
    image: mongo:7
    profiles: ["infra", "core", "full"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ledgerguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-ledgerguard_read}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    mem_limit: 1g

  redis:
    <<: *restart
    image: redis:7-alpine
    profiles: ["infra", "core", "full"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 384m

  kafka:
    <<: *restart
    image: apache/kafka:3.8.1
    profiles: ["infra", "core", "full"]
    ports:
      - "9092:9092"
    environment:
      # KRaft: single node acting as both broker and controller. No ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: everything must be RF=1 or topic creation fails.
      # Production posture (RF>=3, min.insync.replicas=2) is in docs/operations.md.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ledgerguard-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Lists topics through the real client path — proves the broker is
      # actually serving metadata, not merely that the port is open.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 25s
    mem_limit: 1536m

  zipkin:
    <<: *restart
    image: openzipkin/zipkin:3
    profiles: ["infra", "core", "full"]
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m

  # =========================================================================
  # migrate — one-shot Flyway runners.
  #
  # Services also run Flyway on startup; these exist so migrations can be
  # applied and verified WITHOUT the services, which is what makes the schema
  # independently testable (and is how Phase 2 proves the audit REVOKE works).
  # =========================================================================

  flyway-txn:
    image: flyway/flyway:10-alpine
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_TXN_DB:-ledgerguard_txn}
      -user=${POSTGRES_SUPERUSER:-ledgerguard}
      -password=${POSTGRES_SUPERUSER_PASSWORD}
      -connectRetries=10
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      - ./services/transaction-service/src/main/resources/db/migration:/flyway/sql:ro

  flyway-audit:
    image: flyway/flyway:10-alpine
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_AUDIT_DB:-ledgerguard_audit}
      -user=${POSTGRES_SUPERUSER:-ledgerguard}
      -password=${POSTGRES_SUPERUSER_PASSWORD}
      -connectRetries=10
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      - ./services/query-service/src/main/resources/db/migration:/flyway/sql:ro

# ---------------------------------------------------------------------------
# Application services (auth-server, transaction-service, reconciliation-service,
# query-service, gateway, console) join the `core` and `full` profiles as each
# one becomes buildable. See docs/phase-reports/phase-02.md §4 for why they are
# not declared here yet rather than declared and broken.
# ---------------------------------------------------------------------------

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:

networks:
  default:
    name: ledgerguard
