version: '3.8'

services:
  k6:
    image: grafana/k6:latest
    environment:
      - BASE_URL=http://host.docker.internal:8080/api/v1
      - AUTH_TOKEN=test-jwt-token
    volumes:
      - ./k6:/k6
    working_dir: /k6
    command: run --out json=results/results.json scripts/transaction-ingestion.js
    networks:
      - ledgerguard

  influxdb:
    image: influxdb:2.7
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    ports:
      - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - ledgerguard

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ledgerguard
    depends_on:
      - influxdb

volumes:
  influx_data:
  grafana_data:

networks:
  ledgerguard:
    driver: bridge
