# ---------------------------------------------------------------------------
# Hosted demo profile for the read side. See transaction-service's copy for the
# reasoning behind the shared Postgres and Kafka settings.
#
# The read model lives in MongoDB. There is no free managed Kafka+Postgres+Mongo
# from a single vendor, so the demo uses MongoDB Atlas M0 (free, no card) for
# this one piece. If MONGO_URI is left unset the service still starts and every
# projection-backed endpoint reports itself unavailable instead of failing --
# see ReadModelAvailability and the note in docs/deployment.md.
# ---------------------------------------------------------------------------

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:?JDBC_DATABASE_URL is required in the cloud profile}
    username: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
    password: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 10000
      max-lifetime: 240000
      idle-timeout: 120000

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_audit

  data:
    mongodb:
      # No `:?` guard: absent is a supported configuration, not an error. The
      # placeholder host is never contacted, because MongoHealthIndicator and the
      # repository guard both check MONGO_URI's presence first.
      uri: ${MONGO_URI:mongodb://read-model-not-configured:27017/ledgerguard_read}
      auto-index-creation: ${MONGO_AUTO_INDEX:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:?KAFKA_SASL_JAAS_CONFIG is required}
      ssl.endpoint.identification.algorithm: https
      ssl.truststore.location: ${ledgerguard.kafka.truststore-location:}
      ssl.truststore.password: ${ledgerguard.kafka.truststore-password:}
      ssl.truststore.type: PKCS12
    consumer:
      group-id: query-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      # Smaller than local (100). Each batch is held in a 512 MB heap while it
      # projects; the free tier does not have room for the local batch size.
      max-poll-records: 20
      properties:
        # The projection writes to a remote Mongo per record, so a batch takes
        # far longer than it does locally. Left at the 5-minute default, the
        # broker would evict the consumer mid-batch and rebalance forever.
        max.poll.interval.ms: 600000
        session.timeout.ms: 45000
    listener:
      ack-mode: manual_immediate
      # Without this the listener container throws on startup when the broker is
      # briefly unreachable and the whole service fails to boot. Retrying makes a
      # cold start survive a broker that is still waking up.
      missing-topics-fatal: false

  main:
    lazy-initialization: ${LAZY_INIT:true}

ledgerguard:
  read-model:
    # Explicit switch, defaulted from whether a URI was supplied. Set it to false
    # to run the demo with the read model deliberately off and see the degraded
    # console, which is the state docs/deployment.md describes.
    enabled: ${READ_MODEL_ENABLED:${MONGO_URI:false}}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Mongo must NOT drag the service's health down. Render restarts an instance
    # whose health endpoint reports DOWN, so leaving this on would turn "the read
    # model is empty" into a permanent restart loop -- the exact crash the
    # degraded mode exists to avoid.
    mongo:
      enabled: false

logging:
  level:
    dev.ledgerguard: ${LOG_LEVEL:INFO}
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.mongodb.driver.cluster: WARN
