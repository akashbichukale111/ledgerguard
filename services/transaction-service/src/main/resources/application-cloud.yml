# ---------------------------------------------------------------------------
# Hosted demo profile: Render (compute) + a managed Postgres and Kafka.
#
# Activated with SPRING_PROFILES_ACTIVE=cloud. Every value here comes from the
# environment and NOTHING in this file is a secret -- the defaults are either
# non-sensitive or absent, so a missing variable fails loudly at boot rather
# than silently connecting somewhere unintended.
#
# Provider-agnostic on purpose. Aiven, Confluent Cloud, Redpanda and Upstash all
# speak SASL_SSL; they differ only in mechanism and whether their CA is public.
# Both of those are variables here, so switching provider is a dashboard change,
# not a code change.
# ---------------------------------------------------------------------------

spring:
  datasource:
    # One URL rather than host/port/db parts: every managed provider hands you a
    # URI to paste, and reassembling it from parts is where people lose the
    # `sslmode` parameter and get a confusing handshake failure.
    #
    # Aiven requires sslmode=require. Append it to the URL you paste:
    #   jdbc:postgresql://HOST:PORT/defaultdb?sslmode=require
    url: ${JDBC_DATABASE_URL:?JDBC_DATABASE_URL is required in the cloud profile}
    username: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
    password: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    hikari:
      # Aiven's free Postgres allows far fewer connections than the local stack,
      # and three services share it. Ten each would exhaust the server's limit
      # and surface as random "too many clients" failures under demo load.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 10000
      # Managed providers cut idle connections server-side. Recycling below that
      # window avoids handing a half-dead socket to a request.
      max-lifetime: 240000
      idle-timeout: 120000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The free tier gives ONE database, so the three services that each had their
    # own locally now share it. Separate history tables keep their migrations
    # from being read as each other's drift.
    table: flyway_schema_history_txn

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:?KAFKA_SASL_JAAS_CONFIG is required}
      # Verify the broker's hostname against its certificate. Blanking this is
      # the standard cargo-culted "fix" for a handshake error and it disables
      # the protection TLS is there to provide.
      ssl.endpoint.identification.algorithm: https
      # Set by docker/cloud-entrypoint.sh only when KAFKA_CA_PEM is supplied.
      # Empty means "use the system trust store", which is correct for providers
      # with a public CA.
      ssl.truststore.location: ${ledgerguard.kafka.truststore-location:}
      ssl.truststore.password: ${ledgerguard.kafka.truststore-password:}
      ssl.truststore.type: PKCS12
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Longer than the local stack: a free-tier broker across the public
        # internet has a much wider latency spread than a container on loopback,
        # and a 5s request timeout turns ordinary jitter into a failed publish.
        delivery.timeout.ms: 45000
        request.timeout.ms: 20000

  # Lazy init defers bean construction until first use. On a free instance that
  # cold-starts per request, it is a large share of the wait.
  main:
    lazy-initialization: ${LAZY_INIT:true}

ledgerguard:
  outbox:
    # Slower than local (500ms). Each poll is a round trip to a remote database;
    # at demo volume the extra latency is imperceptible and the connection
    # churn saved is not.
    poll-interval-ms: ${OUTBOX_POLL_MS:2000}
    batch-size: 50

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Render polls this to decide the instance is live. Details stay off: an
      # unauthenticated health endpoint should not enumerate infrastructure.
      show-details: never
      probes:
        enabled: true

logging:
  level:
    dev.ledgerguard: ${LOG_LEVEL:INFO}
    # These two log a full stack trace on every reconnect. On a free tier that
    # idles its broker connection, that is most of the log volume.
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.common.utils.AppInfoParser: WARN
