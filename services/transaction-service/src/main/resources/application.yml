spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TXN_DB:ledgerguard_txn}
    username: ${POSTGRES_APP_USER:lg_app}
    password: ${POSTGRES_APP_PASSWORD:}
    hikari:
      # Every network call is bounded. An unbounded pool wait turns a slow database into an
      # unbounded queue of stuck request threads.
      connection-timeout: 5000
      maximum-pool-size: 10

  jpa:
    open-in-view: false          # a lazy load in a controller is a bug, not a convenience
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations are immutable once committed; a checksum change means someone edited history.
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all with retries: the outbox poller blocks on this ack, so a weaker setting would let
      # it mark a record published that the broker had not durably accepted.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000

ledgerguard:
  outbox:
    poll-interval-ms: 500
    batch-size: 100
  kafka:
    topics:
      transactions: transactions.events.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    # Readiness must reflect real dependencies. A probe that returns UP unconditionally is worse
    # than no probe, because it defeats the orchestration that relies on it.
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    dev.ledgerguard: ${LOG_LEVEL:INFO}
